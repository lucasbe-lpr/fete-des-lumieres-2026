<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fête des Lumières 2026 : la carte des œuvres</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;padding:0;overflow:hidden;background:transparent}

#fdl{
  --blue:#0068B1;--blue-dk:#004f87;--blue-lt:#e8f3fb;--blue-bd:#b8d9ef;
  --bg:#fff;--border:#e2e5e8;--border-lt:#eeeff1;--text:#1a1a1a;--muted:#6b7280;
  --font:'Merriweather Sans',sans-serif;
  font-family:var(--font);color:var(--text);background:var(--bg);
  width:100%;height:100%;overflow:hidden;
  display:grid;
  grid-template-columns:100%;
  grid-template-rows:auto auto minmax(0,1fr) 112px;
  grid-template-areas:"head" "search" "map" "list";
}
#fdl .head{grid-area:head;padding:10px 14px 8px;border-bottom:1px solid var(--border);min-width:0}
#fdl .kick{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
#fdl h1{margin:2px 0 0;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fdl .sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fdl .sub:empty{display:none}

#fdl .search{grid-area:search;display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
#fdl .search input{flex:1;min-width:0;font:400 13px var(--font);color:var(--text);border:1px solid var(--border);border-radius:2px;padding:7px 9px;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
#fdl .search input:focus{border-color:var(--blue)}
#fdl .count{font-size:10px;font-weight:700;color:var(--blue);white-space:nowrap;background:var(--blue-lt);border:1px solid var(--blue-bd);border-radius:2px;padding:5px 8px}

#fdl #map{grid-area:map;min-height:0;min-width:0;width:100%;height:100%;background:#eef0f2;outline:none;z-index:0}

#fdl #list{grid-area:list;min-width:0;min-height:0;display:flex;flex-direction:row;gap:8px;padding:9px 12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;border-top:1px solid var(--border);background:#f7f9fb}
#fdl .card{flex:0 0 82%;max-width:290px;height:100%;display:flex;gap:10px;padding:7px;background:#fff;border:1px solid var(--border);border-radius:2px;cursor:pointer;scroll-snap-align:start;min-width:0}
#fdl .card.on{border-color:var(--blue);background:var(--blue-lt)}
#fdl .thumb{position:relative;flex:0 0 76px;height:100%;background:#dfe6ee center/cover no-repeat;border-radius:2px}
#fdl .num{position:absolute;top:0;left:0;min-width:20px;height:20px;padding:0 5px;background:var(--blue);color:#fff;font:700 10px/20px var(--font);text-align:center;border-radius:2px 0 2px 0}
#fdl .info{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
#fdl .name{font-size:12.5px;font-weight:700;line-height:1.3;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#fdl .addr{font-size:9.5px;font-weight:300;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#fdl .go{font-size:10px;font-weight:700;color:var(--blue);text-decoration:none}
#fdl .empty{align-self:center;width:100%;text-align:center;font-size:12px;color:var(--muted)}

/* marqueurs */
.pin{width:26px;height:26px;border-radius:50%;background:var(--blue,#0068B1);color:#fff;font:700 11px/22px 'Merriweather Sans',sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35),0 0 0 4px rgba(0,104,177,.22);transition:transform .15s}
.pin.on{background:#004f87;transform:scale(1.3);box-shadow:0 1px 8px rgba(0,0,0,.4),0 0 0 6px rgba(0,104,177,.3)}

/* popup (même style que l'exemple) */
.leaflet-popup-content-wrapper{border-radius:2px!important;box-shadow:0 4px 24px rgba(0,0,0,.13)!important;padding:0!important;overflow:hidden;font-family:'Merriweather Sans',sans-serif!important;border:1px solid #e2e5e8!important}
.leaflet-popup-content{margin:0!important;width:220px!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup{margin-bottom:14px}
.pop-img{width:100%;aspect-ratio:16/9;background:#dfe6ee center/cover no-repeat}
.pop-b{padding:9px 12px 10px;background:#fff}
.pop-b .n{font-size:12.5px;font-weight:700;color:#1a1a1a;line-height:1.3}
.pop-b .a{font-size:9.5px;color:#6b7280;margin-top:2px;font-weight:300}
.pop-b a{display:inline-block;margin-top:7px;font-size:10px;font-weight:700;color:#0068B1;background:#f0f7fd;border:1px solid #c6dff2;border-radius:2px;padding:3px 9px;text-decoration:none}
.leaflet-container a.leaflet-popup-close-button{color:#fff;text-shadow:0 0 4px rgba(0,0,0,.7);top:4px;right:4px}
.leaflet-container{font-family:'Merriweather Sans',sans-serif}

/* grands écrans : liste verticale à droite */
@media (min-width:900px){
  #fdl{
    grid-template-columns:minmax(0,1fr) 350px;
    grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"map head" "map search" "map list";
  }
  #fdl .head{padding:14px 16px 10px;border-left:1px solid var(--border)}
  #fdl h1{font-size:17px;white-space:normal}
  #fdl .sub{white-space:normal}
  #fdl .search{border-left:1px solid var(--border)}
  #fdl #list{flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:none;border-left:1px solid var(--border);border-top:0}
  #fdl .card{flex:0 0 auto;max-width:none;height:92px;scroll-snap-align:none}
  #fdl .thumb{flex-basis:76px}
}
/* petits mobiles */
@media (max-width:440px){
  .leaflet-popup-content{width:180px!important}
  #fdl{grid-template-rows:auto auto minmax(0,1fr) 100px}
  #fdl .head{padding:8px 12px 6px}
  #fdl h1{font-size:14px}
  #fdl .search{padding:6px 12px}
  #fdl .card{flex-basis:86%}
  #fdl .thumb{flex-basis:64px}
}
@media (max-height:420px) and (max-width:899px){#fdl{grid-template-rows:auto auto minmax(0,1fr) 84px}#fdl .head .kick,#fdl .sub{display:none}}
</style>
</head>
<body>
<div id="fdl">
  <div class="head">
    <div class="kick">Fête des Lumières 2026</div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher une œuvre, un lieu…" aria-label="Rechercher" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div id="map"></div>
  <div id="list"></div>
</div>

{"nom":"Saint-Saëns, le Carnaval immersif","adresse":"Pôle PIXEL","lat":45.75733,"lng":4.89924,"image":"https://www.fetedeslumieres.lyon.fr/sites/fdl/files/2026-10/Pixel_Carnaval_animaux_.webp"}]}

<script>
(function(){
var D=JSON.parse(document.getElementById('fdl-data').textContent);
var items=(D.items||[]).filter(function(i){return isFinite(i.lat)&&isFinite(i.lng)});
document.getElementById('title').textContent=D.title||'Fête des Lumières';
document.getElementById('sub').textContent=D.subtitle||'';
document.title=D.title||document.title;

// visuel de secours (aucune photo fournie) : dégradé bleu généré
function ph(i){var h=205+((i*13)%30);
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+h+',100%,35%)"/><stop offset="1" stop-color="hsl('+h+',80%,82%)"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><circle cx="200" cy="150" r="46" fill="#fff" fill-opacity=".35"/></svg>';
  return 'url("data:image/svg+xml,'+encodeURIComponent(s)+'")';}
function img(it,i){return it.image?'url("'+String(it.image).replace(/"/g,'%22')+'")':ph(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function gmaps(it){return 'https://www.google.com/maps/dir/?api=1&destination='+it.lat+','+it.lng}

var map=L.map('map',{zoomControl:false}).setView([45.764,4.835],14);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var markers=[],cards=[],active=-1,list=document.getElementById('list');

items.forEach(function(it,i){
  var m=L.marker([it.lat,it.lng],{icon:L.divIcon({className:'',html:'<div class="pin">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14]}),title:it.nom}).addTo(map);
  var pop=el('div'),pi=el('div','pop-img'),pb=el('div','pop-b');
  pi.style.backgroundImage=img(it,i);
  pb.appendChild(el('div','n',it.nom));pb.appendChild(el('div','a',it.adresse));
  var a=el('a',null,'Itinéraire →');a.href=gmaps(it);a.target='_blank';a.rel='noopener';pb.appendChild(a);
  pop.appendChild(pi);pop.appendChild(pb);
  m.bindPopup(pop,{autoPanPadding:[20,20],maxWidth:220});
  m.on('click',function(){select(i,false)});
  markers.push(m);

  var c=el('div','card'),th=el('div','thumb'),inf=el('div','info');
  th.style.backgroundImage=img(it,i);th.appendChild(el('span','num',i+1));
  inf.appendChild(el('div','name',it.nom));inf.appendChild(el('div','addr',it.adresse));
  var g=el('a','go','Itinéraire →');g.href=gmaps(it);g.target='_blank';g.rel='noopener';g.onclick=function(e){e.stopPropagation()};
  inf.appendChild(g);c.appendChild(th);c.appendChild(inf);
  c.onclick=function(){select(i,true)};
  list.appendChild(c);cards.push(c);
});
var empty=el('div','empty','Aucune œuvre ne correspond.');empty.hidden=true;list.appendChild(empty);

function scrollToCard(c){ // défilement interne à la liste uniquement (ne fait pas bouger la page hôte)
  if(list.scrollWidth>list.clientWidth+2&&getComputedStyle(list).flexDirection==='row')
    list.scrollTo({left:c.offsetLeft-12,behavior:'smooth'});
  else list.scrollTo({top:c.offsetTop-list.offsetTop-9,behavior:'smooth'});
}
function select(i,fly){
  if(active>-1){markers[active].getElement().firstChild.classList.remove('on');cards[active].classList.remove('on')}
  active=i;markers[i].getElement().firstChild.classList.add('on');cards[i].classList.add('on');
  scrollToCard(cards[i]);
  if(fly){map.setView(markers[i].getLatLng(),Math.max(map.getZoom(),16),{animate:true});markers[i].openPopup()}
}

var q=document.getElementById('q'),count=document.getElementById('count');
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function fit(pts){if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:16})}
function filter(){
  var t=norm(q.value),n=0,pts=[];
  items.forEach(function(it,i){
    var ok=!t||norm(it.nom+' '+it.adresse).indexOf(t)>-1;
    cards[i].style.display=ok?'':'none';
    if(ok){markers[i].addTo(map);n++;pts.push(markers[i].getLatLng())}else map.removeLayer(markers[i]);
  });
  empty.hidden=n>0;count.textContent=n+' œuvre'+(n>1?'s':'');
  fit(pts);
}
q.addEventListener('input',filter);
filter();

setTimeout(function(){map.invalidateSize();filter()},300);
window.addEventListener('resize',function(){
  clearTimeout(window._fdlT);window._fdlT=setTimeout(function(){map.invalidateSize()},200);
});
})();
</script>
</body>
</html>
